var ATT=[{n:'조서초안_2026-1022-04_v1.pdf',h:[
'<h3>피의자 진술 조서 초안</h3><div class=kv>'+kvh([['사건명','도심 상가 방화 사건'],['사건번호','2026-1022-04'],['작성','이도윤 센티넬, 조서관리'],['근거 자료','심문 담당 박성호 센티넬 작성 심문 기록, 현장대응 보고'],['문서 상태','초안, 검토 중'],['분량','8쪽']])+'</div><h4>1. 사건의 개요</h4><p>가. 발생 일시: 2026년 10월 22일(목) 18시 40분경으로 추정된다.</p><p>나. 발생 장소: 도심 상업지역 중앙대로 일대에 소재한 지상 5층, 지하 1층 규모의 상가 건물이다. 연면적은 3,400㎡ 내외로 추정된다.</p><p>다. 범행 내용: 피의자들은 능력을 사용하여 위 건물에 방화하였고, 화염은 건물 전체로 확산되었다. 피해자 전원이 센터 소속이 아닌 일반 시민이고 범행이 불특정 다수를 대상으로 이루어졌으므로, 본 사건은 테러 범죄로 분류함이 상당하다.</p><p>라. 피해 결과: 사망자 26명이 확인되었고, 중상 38명 내외, 경상 100명 내외로 추정된다. 위 수치는 추가 확인 과정에서 변동될 수 있다.</p><p>마. 특이 사항: 화재 연기에 노출된 능력자에게서 능력 통제력이 급격히 저하되고 폭주가 유발되는 현상이 확인되었다. 현장에서 검거된 능력자 4명은 모두 폭주 전조 증상을 보였다.</p>',
'<h4>2. 현장 상황</h4><p>가. 18시 42분 최초 신고가 접수되었고, 18시 44분 센터 현장대응팀 14명에게 출동이 지시되었으며, 18시 54분 현장에 도착하였다. 소방 방수는 18시 58분에 개시되었고 완전 진화는 22시 14분에 이루어졌다.</p><p>나. 도착 당시 건물 3층부터 5층까지 화염이 확산되어 있었다. 1층 출입구와 도로에는 대피한 시민과 부상자 130명 내외가 있었던 것으로 추정된다.</p><p>다. 화염은 일반 화재와 달리 상층으로 번지지 않고 외벽을 따라 수평 방향으로 확산되었으며, 방수에도 쉽게 진화되지 않았다.</p><p>라. 열기로 인근 차량 15대 내지 20대와 상가 유리창 200장 내외가 파손된 것으로 추정된다.</p>',
'<h4>3. 연기 노출에 따른 능력자 이상 증상</h4><p>가. 화재 연기에 노출된 능력자에게서 능력 통제력이 급격히 저하되고 폭주가 유발되는 현상이 확인되었다. 연기의 구성 물질은 현재까지 특정되지 않았다.</p><p>나. 센터는 연기 흡입 방지 장비를 착용한 현장대응팀 14명을 투입하였다. 그러나 투입된 센티넬 3명이 감각 과부하 증상을 보였고, 가이드의 지원을 받은 뒤 임무에 복귀하였다.</p><p>다. 현장에서 검거된 능력자 4명은 시선이 풀린 채 고함을 지르고 열 방출을 통제하지 못하는 등 폭주 전조 증상을 보였다. 이는 연기 노출의 영향으로 추정된다.</p><p>라. 능력자가 아닌 일반 시민에게서는 호흡기 증상 외의 이상 증상이 보고되지 않았다. 호흡기 증상으로 이송된 인원은 70명 내외로 추정된다.</p><h4>4. 현장 정리 상태</h4><p>가. 현장에서는 조직의 표식, 서명, 성명문이 발견되지 않았다.</p><p>나. 1층 중앙 홀 바닥 중앙에 반경 1.8m의 원형 구역이 연소되지 않은 채 남아 있었다. 그 바깥쪽 바닥에는 반경 3.6m와 4.2m의 동심원 두 줄이 열에 그을려 새겨져 있었다.</p>',
'<p>다. 사망자 11명이 원의 가장자리를 따라 균등한 간격으로 누워 있었다. 전원 머리가 원의 안쪽을, 발이 바깥쪽을 향하고 있었으며, 양손은 가슴 위에 포개어져 있었다. 신발은 벗겨져 각자의 발끝 쪽에 한 켤레씩 가지런히 놓여 있었다.</p><p>라. 원의 중심에는 중앙 안내 데스크가 옮겨져 있었고, 그 위에 사망자 11명의 지갑, 휴대전화, 신분증이 1인당 한 묶음씩 쌓여 있었다. 현장대응팀은 이 배치가 신전에서 제물을 올려 두는 형태와 유사하다고 기록하였다.</p><p>마. 위 11명에게서는 의복의 연소 흔적이 확인되지 않았다.</p>'+'<h4>5. 인명 피해</h4><p>가. 사망 26명이며, 현장에서 22명, 병원 이송 후 4명이 사망하였다. 중상 38명 내외, 경상 100명 내외로 추정된다.</p><p>나. 센터 소속 현장대응팀 센티넬 1명이 2도 화상으로 치료 중이며, 회복에 8주 내외가 소요될 것으로 추정된다.</p>',
'<h4>6. 피의자의 인적사항 및 검거 경위</h4><p>가. 피의자 1 오재혁: 1992.03.14생, 만 34세, 남, 무직. 열 계열 능력자로 파악되어 최초 C등급으로 추정되었으나, 10월 25일 폭주 이후 실시한 정밀 검사에서 A등급 센티넬로 확인되었다. 센터 미등록, 전과 없음. 10월 22일 19시 12분경 건물 후면 골목에서 검거되었다.</p><p>나. 피의자 2 문재훈: 1985.09.02생, 만 41세, 남, 건설 현장 일용직. 열 계열 능력 D등급이며 2년 전 센터에 등록되었다. 전과 1건(폭행, 벌금 300만 원). 19시 25분경 건물 1층 로비에서 검거되었다.</p><p>다. 피의자 3 배소연: 1997.12.19생, 만 28세, 여, 편의점 근무. 열 계열 능력 C등급, 센터 미등록, 전과 없음. 19시 18분경 지하 1층 주차장 출구에서 검거되었다.</p><p>라. 피의자 4 조성윤: 생년월일 미기재, 만 37세로 추정, 남, 택배 기사. 열 계열 능력 D등급, 센터 미등록, 전과 1건(절도). 20시 48분경 인근 지하보도에서 검거되었다.</p><p>마. 인근 CCTV 기록에서 4명이 10월 17일부터 21일 사이 도심 외곽 폐창고에 함께 출입한 장면이 4회 확인되었다.</p>',
'<h4>7. 심문 경과</h4><p>가. 심문은 박성호 센티넬이 전담하였다. 피의자별 심문 시간은 다음과 같다.</p><ul><li>오재혁: 10월 23일 10:00~12:20, 10월 24일 14:00~16:30, 10월 25일 13:00~13:40</li><li>문재훈: 10월 23일 14:00~15:40, 10월 24일 10:00~11:50</li><li>배소연: 10월 23일 16:10~17:30, 10월 24일 09:00~10:40</li><li>조성윤: 10월 26일 13:00~15:10, 10월 27일 10:00~11:30</li></ul><p>나. 4명은 서로 다른 시간대에 별도로 진행된 심문에서 각각 ‘명운단’이라는 명칭을 언급하였다. 언급 시각은 오재혁 10월 23일 11:42, 배소연 10월 24일 09:50, 문재훈 10월 24일 10:55, 조성윤 10월 26일 14:15이다. 조서 작성 단계에서 심문 기록을 대조하던 중 위 공통점이 확인되었다.</p><p>다. 범행 동기를 묻는 질문에 4명 모두 “정해진 일을 했다”는 동일한 문장으로 진술하였다. 오재혁과 배소연은 10월 17일부터 21일까지의 기억이 없다고 진술하였다.</p>',
'<h4>8. 소지품에서 확인된 도안</h4><p>가. 소지품 대조 결과 동일한 도안이 피의자 3명에게서 확인되었다. 오재혁은 은색 펜던트 목걸이(직경 18mm 내외), 문재훈은 손목시계 케이스 안쪽 각인(직경 9mm 내외), 배소연은 지갑 안쪽 가죽에 눌러 새긴 형태(가로 22mm 내외)이다. 조성윤에게서는 확인되지 않았다.</p><p>나. 도안은 세 개의 검은색 구가 삼각형의 꼭짓점에 놓여 검은 선으로 서로 연결되어 있고, 그 중앙에 흰색 원형이 위치한 형태이다. 흔히 볼 수 있는 상징과 구별되는 특징이 뚜렷하지 않아 소지품을 처음 대조할 때에는 주목받지 못하였다. 크기와 소지 방식이 일관되지 않아 조직의 표식으로 단정하기는 어렵다. 감정은 10월 30일 의뢰되었으며, 결과 회신은 12월 4일 예정이다.</p><div style="text-align:center;margin:6px 0">'+SVG+'<div class=s>[그림 1] 도안 모사</div></div>',
'<h4>9. 추가 파견</h4><p>가. 1차 파견(10월 25일)은 사건 현장 재조사를 위한 것이었다. 2차(10월 29일)와 3차(10월 31일) 파견은 심문 기록에서 ‘명운단’이라는 공통 명칭이 확인된 이후 조직과 관련된 흔적을 확인하기 위하여 실시되었다.</p><p>나. 3차례 모두 위 4항의 현장 상태가 재확인된 것 외에 조직의 흔적은 확인되지 않았다. 4차 조사는 11월 4일 18시 30분 3구역 일대에서 5명 규모로 실시될 예정이다.</p><h4>10. 판단</h4><p>가. 명운단이 본 사건의 배후에 있는지 여부는 심문 과정에서 확보한 진술에 근거한 추정에 불과하며, 이를 입증할 물증은 현재까지 확보되지 않았다.</p><p>나. 4명의 진술이 동일한 문장으로 일치하고 2명에게서 기억 공백이 확인된 점에 비추어, 피의자들의 정신에 개입하는 높은 등급의 정신계 센티넬이 조직을 조력하고 있을 가능성이 거론된다. 다만 이를 확정할 증거는 없다.</p><p>다. 조직의 규모가 거대할 것으로 추정되므로 센터는 관련 내용을 대외비로 관리한다.</p><h4>11. 특이 사항</h4><p>가. 10월 25일 13시 40분경 오재혁에 대한 세 번째 심문 중 오재혁이 폭주를 일으켜 심문 담당자 박성호 센티넬이 왼팔에 부상을 입었다. 폭주의 원인은 확인 중이며, 사고·이상 상황 보고서는 10월 26일 보고되었다.</p><p>나. 폭주 이후 실시한 정밀 검사에서 오재혁은 센터에 등록되지 않은 A등급 센티넬로 확인되었고, 이에 따라 최초 C등급 추정은 정정되었다.</p><p>다. 심문실 2의 사용이 중지되었으므로 잔여 심문은 재배정된 장소에서 실시한다. 내부에서 거론되는 미확인 소문은 확정된 사실로 취급하지 않는다.</p><p class=nn>※ 검토 필요: 피의자 4 조성윤의 생년월일 기재 확인</p><div class=s>작성 이도윤 센티넬 · 검토 김운학 가이드</div>']},
{n:'심문대상자정보_2026-1019-02.pdf',h:[
'<h3>심문 대상자 정보</h3><div class=kv>'+kvh([['사건명','장기매매 사건'],['사건번호','2026-1019-02'],['인계자','박성호 센티넬, 심문 담당'],['인계 대상','2명']])+'</div><h4>1. 사건의 개요</h4><p>가. 인지 일시: 2026년 10월 19일(월) 02시경으로 추정된다. 항만 물류창고 인근을 순찰하던 중 이송 차량이 적발되었다.</p><p>나. 범행 내용: 피의자들은 일반 시민을 모집·유인하여 불법 의료시설로 이송한 뒤 장기를 적출하고, 이를 매매하였다. 피의자들이 능력을 사용하여 범행하였으므로 본 사건은 센터가 수사를 담당한다.</p><p>다. 피해자: 20대에서 30대 사이의 일반 시민 17명 내외로 추정된다. 11명이 구조되었고, 소재가 확인되지 않은 인원은 6명 내외로 추정된다.</p><p>라. 거래 대금: 60억 원 내외로 추정된다.</p><h4>2. 피의자 1</h4><p>가. 성명: 윤태성, 1987.07.21생, 만 39세, 남, 무직</p><p>나. 능력: 중력 계열 B등급, 센터 미등록. 피해자를 제압하여 이송하는 데 능력을 사용하였다.</p><p>다. 역할: 피해자 모집 및 이송 총괄</p><p>라. 전과: 2건(폭행 1건, 절도 1건)</p><p>마. 검거: 10월 20일 23시 30분경, 항만 물류창고 인근</p>',
'<h4>3. 피의자 2</h4><p>가. 성명: 한서진, 1994.11.05생, 만 31세, 여, 자동차 정비업</p><p>나. 능력: 전기 계열 C등급, 센터 미등록. 의료시설의 감시 장비를 무력화하는 데 능력을 사용하였다.</p><p>다. 역할: 이송 차량 개조 및 감시 장비 무력화</p><p>라. 전과: 없음</p><p>마. 검거: 10월 21일 04시 50분경, 자택</p><h4>4. 심문 경과</h4><p>가. 윤태성: 10월 22일 10:00~12:10, 10월 23일 14:00~16:40, 10월 25일 10:00~11:30</p><p>나. 한서진: 10월 22일 14:00~15:20, 10월 24일 10:00~12:00</p><h4>5. 진술 요지</h4><p>가. 윤태성은 피해자 모집과 이송을 인정하였고, ‘중개인’으로 불리는 인물의 지시를 받았다고 진술하였다.</p><p>나. 한서진은 이송 차량 개조와 감시 장비 무력화를 인정하였다.</p><p>다. 두 사람 모두 장기 적출을 담당한 인원이 1명 이상 더 있다고 진술하였으며, 해당 인원은 검거되지 않았다.</p><h4>6. 인계 사항</h4><p>심문 조서 2건을 이도윤 센티넬(조서관리)에게 인계하며, 접수를 요청한다.</p>']}];
ATT.push({n:'점검결과보고_보안관리-2026-1102-01.pdf',h:[
'<h3>도심 상가 방화 사건 관련 내부 문서 관리 실태 점검 결과 보고</h3><div class=kv>'+kvh([['문서번호','보안관리-2026-1102-01'],['작성','보안관리과 점검반'],['수신','강태건 팀장 외 2'],['작성일','2026.11.02'],['열람 등급','열람 제한, 열람 이력 기록'],['분량','3쪽']])+'</div><h4>1. 점검 배경 및 경과</h4><p>가. 2026년 10월 22일 발생한 도심 상가 방화 사건(사건번호 2026-1022-04)과 관련하여, 10월 23일 사건 관련 문서 3건의 열람 기록과 접속 기록이 일치하지 않는다는 보고가 보안관리과에 접수되었다.</p><p>나. 센터는 10월 24일 점검반 5명(보안관리과 3명, 감사담당관실 2명)을 편성하여 내부 문서 관리 실태 전수 점검에 착수하였다. 10월 26일까지는 단순 입력 오류 또는 시스템 오류의 가능성을 배제하지 않았다.</p><p>다. 10월 28일 일부 정보가 의도적으로 누락되거나 조작된 정황이 확인되었고, 10월 29일 대상자 3명의 문서 접근 권한을 박탈하고 불구속 수사로 전환하였다. 11월 1일 대상자 1명이 사망하여 11월 2일 공소권 없음으로 처리하였다.</p><h4>2. 점검 방법 및 범위</h4><p>가. 대상 기간은 9월 22일부터 10월 28일까지이며, 대상 문서는 4,200건 내외이다. 문서 작성·수정·삭제 이력, 열람 이력, 단말 접속 기록, 출입 기록을 상호 대조하였고 직원 22명 내외를 면담하였다.</p><p>나. 시스템 로그의 보관 기간이 90일이어서 그 이전 이력은 확인하지 못하였다.</p>',
'<h4>3. 확인된 사항</h4><p>가. 기록의 누락: 방화 사건 심문 기록 사본 4건 중 2건에서 진술 구간이 삭제되었다. 박성호 센티넬 작성 원본과 대조한 결과 각각 6분 내외, 9분 내외 분량이 빠져 있었고, 삭제 구간에는 용의자가 ‘명운단’이라는 명칭을 언급한 부분이 포함되어 있었다. 이 때문에 용의자 4명의 공통점이 조서 작성 단계에서야 확인된 것으로 추정된다. 삭제는 10월 23일 22시 40분경부터 10월 24일 01시 10분경 사이에 이루어졌고, 삭제 단말은 기록관리과 서재원 주무관의 단말로 확인되었다.</p><p>나. 기록의 조작: 운영지원과 노미경 주무관이 현장대응 보고서 반출 승인서 2건의 승인자 서명란을 허위로 기재하였고, 배정·매칭과 지현수 주무관이 10월 23일부터 27일 사이 타인의 권한으로 방화 사건 심문 기록 등을 7회 내외 열람하였다. 위 행위들이 하나의 연관된 행위인지는 확정되지 않았다.</p><p>다. 접근 기록의 범위: 대상자 3명의 계정은 방화 사건 외의 다른 문서에도 장기간 여러 차례 접근한 기록이 있다. 다만 해당 문서들은 로그 보관 기간의 한계로 기록 대조가 불가능하여, 어떤 부분이 누락 또는 조작되었는지는 확인할 수 없다.</p><h4>4. 대상자 및 조치</h4><p>가. 서재원(1980.05.11생, 만 46세, 기록관리과, 감각 계열 센티넬 C등급), 노미경(1985.02.27생, 만 41세, 운영지원과, 가이드 B등급), 지현수(1988.09.09생, 만 38세, 배정·매칭과, 센티넬 D등급)이다.</p><p>나. 10월 29일 14시 문서 접근 권한 박탈, 업무 단말 회수, 대외비 구역 출입 제한을 실시하였다. 도주 우려가 낮고 면담에 협조하여 불구속 수사로 전환하였으며, 주 2회 출석 조사를 조건으로 하였다.</p><h4>5. 대상자의 성향 관련 확인 사항</h4><p>가. 면담 직원 6명이 대상자 3명에 대하여 ‘능력자가 일반 직원보다 높은 권한을 가져야 한다’는 취지의 발언을 한 적이 있다고 진술하였다. 내부 게시판에서도 같은 취지의 글 17건 내외가 대상자 계정으로 작성되었으며, 일부는 삭제된 상태였다.</p><p>나. 위 사항은 성향에 관한 정황이며 문서의 누락·조작 행위와의 인과관계는 확인되지 않았다.</p>',
'<h4>6. 서재원 사망 경위 및 후속 처리</h4><p>가. 11월 1일(일) 07시 20분경 서재원이 자택에서 사망한 채 발견되었다. 관계 기관의 조사 결과 외부 침입 흔적이나 타살 혐의점은 확인되지 않았고, 본인의 선택에 의한 사망으로 판단되었다. 별도의 서면 유언은 확인되지 않았다.</p><p>나. 마지막 출석 조사는 10월 31일 오후에 있었으며 당시 특이 사항은 기록되지 않았다. 피의자 사망에 따라 11월 2일 공소권 없음으로 처리하였다.</p><p>다. 센터는 동료 직원을 대상으로 심리 상담을 지원하고 있으며, 필요한 직원은 인사 담당 부서에 신청할 수 있다.</p><h4>7. 유류품 및 소지품 조사</h4><p>가. 11월 2일 서재원의 자택과 센터 내 사물함을 조사한 결과, 책상 서랍에서 금속 열쇠고리 1개가 확인되었다. 열쇠고리 안쪽 면에는 세 개의 검은색 구가 삼각형의 꼭짓점에 놓여 검은 선으로 서로 연결되고 그 중앙에 흰색 원형이 위치한 도안이 각인되어 있었다.</p><div style="text-align:center;margin:6px 0">'+SVG+'<div class=s>[그림 1] 열쇠고리 각인 도안 모사</div></div><p>나. 위 도안은 방화 사건 피의자 3명의 소지품에서 확인된 도안과 육안 대조상 같은 형태이다. 노미경과 지현수의 소지품에서는 확인되지 않았다.</p><h4>8. 판단 및 향후 조치</h4><p>가. 방화 사건 관련 기록이 의도적으로 누락 또는 조작된 정황이 확인되어, 센터 내부에 해당 행위를 한 인원이 있었을 가능성이 있다. 다만 서재원의 도안 소지만으로 명운단의 구성원으로 단정할 수 없고, 노미경과 지현수의 관련성은 확인되지 않았다. 직접 진술을 더 확보할 수 없고 일부 문서는 기록 대조가 불가능하여, 위 판단은 모두 추정에 해당하며 실제 피해 범위도 확정할 수 없다.</p><p>나. 노미경과 지현수에 대한 수사 및 징계 절차를 계속하고, 로그 보관 기간을 1년으로 연장하며, 방화 사건 기록을 원본과 재대조하고 심문 기록을 이중 보관한다. 대외비 문서의 접근 권한 체계도 재편한다.</p><h4>9. 유의 사항</h4><p>본 문서는 열람 제한 문서로서 열람 이력이 기록되며 외부에 제공할 수 없다. 추정으로 기재된 사항과 내부에서 거론되는 미확인 소문은 확정된 사실로 취급하지 않는다.</p>']});
